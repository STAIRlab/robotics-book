name: Render Chapter 6 notebook and figures

on:
  workflow_dispatch:
  push:
    branches:
      - book-figure-revision
    paths:
      - .github/workflows/render-chapter6-notebook.yml
      - notebooks/real-time-bayesian-systems.ipynb

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Check out working branch
        uses: actions/checkout@v4
        with:
          ref: book-figure-revision
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install notebook dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install nbconvert ipykernel
      - name: Execute and save notebook outputs
        run: |
          python -m jupyter nbconvert --to notebook --execute --inplace \
            --ExecutePreprocessor.timeout=180 notebooks/real-time-bayesian-systems.ipynb
      - name: Commit executed notebook and exported figures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notebooks/real-time-bayesian-systems.ipynb
          git add figures/JNB6-realtime-latency-final.pdf figures/JNB6-realtime-latency-final.png
          if ! git diff --cached --quiet; then
            git commit -m "Save executed Chapter 6 notebook and updated figure"
            git push origin HEAD:book-figure-revision
          fi
