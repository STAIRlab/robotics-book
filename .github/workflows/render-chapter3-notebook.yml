name: Render Chapter 3 notebook and figures

on:
  workflow_dispatch:
  push:
    branches:
      - book-figure-revision
    paths:
      - .github/workflows/render-chapter3-notebook.yml
      - notebooks/bayesian-updating.ipynb
      - robotics_book/chapter_examples.py
      - notebooks/book.mplstyle

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Check out working branch
        uses: actions/checkout@v4
        with:
          ref: book-figure-revision
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install notebook dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install nbconvert ipykernel
      - name: Execute and save notebook outputs
        run: |
          python -m jupyter nbconvert --to notebook --execute --inplace \
            --ExecutePreprocessor.timeout=180 notebooks/bayesian-updating.ipynb
      - name: Commit executed notebook and exported figures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notebooks/bayesian-updating.ipynb
          git add figures/bayesian-updating.pdf figures/bayesian-updating.png
          git add figures/bayesian-updating-sequences.pdf figures/bayesian-updating-sequences.png
          git add figures/bayesian-updating-bias.pdf figures/bayesian-updating-bias.png
          git add figures/bayesian-updating-correlation.pdf figures/bayesian-updating-correlation.png
          git add results/bayesian-updating.json results/bayesian-updating-extended.json
          if ! git diff --cached --quiet; then
            git commit -m "Save executed Chapter 3 notebook and publication figures"
            git push origin HEAD:book-figure-revision
          fi
